[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdc-takeoff-proto"
version = "0.1.0"
description = "BDC plan takeoff engine prototype (CLI, no UI/DB)"
requires-python = ">=3.12"
dependencies = [
  "ezdxf>=1.3",
  "pymupdf>=1.24",
  "shapely>=2.0",
  "openpyxl>=3.1",
  "matplotlib>=3.8",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
bdc-takeoff = "cli:main"

[tool.setuptools]
packages = ["takeoff"]
py-modules = ["cli"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
